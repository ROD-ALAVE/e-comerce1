<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container-fluid p-3">
    <!-- Navbar con Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
        <div class="container-fluid">
            <div class="row w-100 text-center">
                <div class="col-md-3">
                    <a href="../index.html" class="nav-link">Ir a la Version 1</a>
                    <small class="text-muted">e-comerce1.html</small>
                </div>
                <div class="col-md-3">
                    <a href="../e-comerce2/index.html" class="nav-link">Ir a la Version 2</a>
                    <small class="text-muted">e-comerce2.html</small>
                </div>
                <div class="col-md-3">
                    <a href="../e-comerce3/index3.html" class="nav-link">Ir a la Version 3</a>
                    <small class="text-muted">e-comerce3.html</small>
                </div>
                <div class="col-md-3">
                    <a href="productos1.html" class="nav-link">Ir a la Version Productos 1</a>
                    <small class="text-muted">productos1.html</small>
                </div>
            </div>
        </div>
    </nav>

    <h1 class="mb-4">Gestión de Productos</h1>

    <div class="container-fluid">
        <!-- Filtros de búsqueda con Bootstrap -->
        <div class="row g-3 mb-4 p-3 bg-light rounded">
            <div class="col-md-4">
                <label for="searchName" class="form-label">Buscar por nombre:</label>
                <div class="input-group">
                    <input type="text" id="searchName" class="form-control" placeholder="Ej: Laptop">
                    <button id="btnSearchName" class="btn btn-primary">Buscar</button>
                </div>
            </div>

            <div class="col-md-4">
                <label for="searchCat" class="form-label">Buscar por categoría:</label>
                <div class="input-group">
                    <input type="text" id="searchCat" class="form-control" placeholder="Ej: Laptops">
                    <button id="btnSearchCat" class="btn btn-primary">Buscar</button>
                </div>
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <button id="btnReset" class="btn btn-secondary w-100">Mostrar todos</button>
            </div>
        </div>

        <!-- Tabla de productos con Bootstrap -->
        <div class="table-responsive mb-4">
            <table class="table table-bordered table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Ícono</th>
                        <th>Nombre</th>
                        <th>Especificación</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Badge</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    <!-- Los productos se cargarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>

        <!-- Formulario para crear/editar producto con Bootstrap -->
        <div class="card">
            <div class="card-header">
                <h2 class="h4 mb-0">Formulario de Producto</h2>
            </div>
            <div class="card-body">
                <form id="formProducto">
                    <input type="hidden" id="productId">

                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre:</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="spec" class="form-label">Especificación:</label>
                        <input type="text" id="spec" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">Precio:</label>
                        <input type="number" id="price" class="form-control" step="0.01" required>
                    </div>

                    <div class="mb-3">
                        <label for="cat" class="form-label">Categoría:</label>
                        <input type="text" id="cat" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="icon" class="form-label">Ícono:</label>
                        <input type="text" id="icon" class="form-control" placeholder="Ej: 💻" required>
                    </div>

                    <div class="mb-3">
                        <label for="badge" class="form-label">Badge:</label>
                        <input type="text" id="badge" class="form-control" placeholder="hot, new, sale">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="productos.js"></script>
</body>

</html>
